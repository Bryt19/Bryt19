<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="50%" stop-color="#A371F7"/>
    <stop offset="100%" stop-color="#3FB950"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="220" rx="20" fill="#0D1117"/>

<text x="600" y="42"
   text-anchor="middle"
   fill="#F0F6FC"
   font-family="Arial, sans-serif"
   font-size="22"
   font-weight="700">
HOW I LIKE TO BUILD </text>

<text x="600" y="68"
   text-anchor="middle"
   fill="#8B949E"
   font-family="Arial, sans-serif"
   font-size="13">
From problem to production </text>

<line x1="100" y1="125" x2="1100" y2="125"
   stroke="#30363D"
   stroke-width="4"
   stroke-linecap="round"/>

<line x1="100" y1="125" x2="1100" y2="125"
   stroke="url(#line)"
   stroke-width="4"
   stroke-linecap="round"
   stroke-dasharray="1000"
   stroke-dashoffset="1000">

<animate
 attributeName="stroke-dashoffset"
 from="1000"
 to="0"
 dur="4s"
 repeatCount="indefinite"/> </line>

<g font-family="Arial, sans-serif" text-anchor="middle">

  <circle cx="100" cy="125" r="20" fill="#161B22" stroke="#58A6FF" stroke-width="3"/>
  <text x="100" y="131" fill="#F0F6FC" font-size="16">💡</text>
  <text x="100" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Problem</text>

  <circle cx="300" cy="125" r="20" fill="#161B22" stroke="#58A6FF" stroke-width="3"/>
  <text x="300" y="131" fill="#F0F6FC" font-size="16">🔎</text>
  <text x="300" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Research</text>

  <circle cx="500" cy="125" r="20" fill="#161B22" stroke="#A371F7" stroke-width="3"/>
  <text x="500" y="131" fill="#F0F6FC" font-size="16">🎨</text>
  <text x="500" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Design</text>

  <circle cx="700" cy="125" r="20" fill="#161B22" stroke="#A371F7" stroke-width="3"/>
  <text x="700" y="131" fill="#F0F6FC" font-size="16">💻</text>
  <text x="700" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Build</text>

  <circle cx="900" cy="125" r="20" fill="#161B22" stroke="#3FB950" stroke-width="3"/>
  <text x="900" y="131" fill="#F0F6FC" font-size="16">🧪</text>
  <text x="900" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Test</text>

  <circle cx="1100" cy="125" r="20" fill="#161B22" stroke="#3FB950" stroke-width="3"/>
  <text x="1100" y="131" fill="#F0F6FC" font-size="16">🚀</text>
  <text x="1100" y="165" fill="#F0F6FC" font-size="13" font-weight="600">Ship</text>

</g>

<circle r="7" fill="#FFFFFF" filter="url(#glow)">
  <animateMotion
    path="M 100,125 L 1100,125"
    dur="4s"
    repeatCount="indefinite"/>
</circle>

</svg>
